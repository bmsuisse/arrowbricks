[project]
name = "arrowbricks"
version = "3.0.2"
description = "Runs SQL against a Databricks SQL warehouse via the Statement Execution API and hands you the result as Arrow -- a DB-API-ish Cursor (fetchone/fetchmany/fetchall/fetchall_arrow) or NDJSON streaming. Rust/PyO3 core throughout -- zero required runtime dependencies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# No hard runtime dependencies -- httpx and arro3-io are fully eliminated
# (see rust/arrowbricks_core's own reqwest client + Arrow-IPC/NDJSON
# writer). arro3-core is optional (see below): only Cursor.fetchone/
# fetchmany/fetchall's row materialization needs it -- fetchall_arrow,
# stream_query_json, upload_volume_file/delete_volume_file, and
# Cursor.description all work with zero dependencies installed.
dependencies = []

[project.optional-dependencies]
# pyo3-arrow's own Table.column()/schema methods are designed to hand back
# the caller's *real* arro3.core objects for further arro3-ecosystem
# interop (not a value pyo3-arrow can materialize itself), so
# fetchone/fetchmany/fetchall need this installed. `pip install
# arrowbricks[arro3]` -- or handle rows as Arrow via fetchall_arrow/
# fetchmany_arrow instead, which don't need it at all.
arro3 = ["arro3-core>=0.8"]

[project.urls]
Repository = "https://github.com/bmsuisse/arrowbricks"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

# The compiled hot path (rust/arrowbricks_core) builds into this same wheel as
# arrowbricks._core -- not a separately published package -- so `pip install
# arrowbricks` is the only install step. python-source points at the existing
# src/ layout (arrowbricks/__init__.py, client.py, cursor.py, _streaming.py);
# manifest-path points back at the Cargo.toml living under rust/, since it
# isn't in the same directory as this pyproject.toml.
[tool.maturin]
python-source = "src"
module-name = "arrowbricks._core"
manifest-path = "rust/arrowbricks_core/Cargo.toml"
# `license-files` above declares LICENSE in metadata, but maturin's sdist
# build doesn't bundle a repo-root file just because it's referenced there --
# it needs to be told explicitly, or PyPI rejects the upload with "License-File
# LICENSE does not exist in distribution file" (a real failure the first time
# v1.0.0 released: all 5 wheels published fine, only the sdist hit this).
include = ["LICENSE"]

[dependency-groups]
# arro3-core/arro3-io are test-only -- tests/conftest.py uses them to build
# synthetic Arrow-IPC chunk bytes so tests exercise a real Arrow IPC round
# trip. The package itself has no runtime dependency on them (or anything
# else) -- see rust/arrowbricks_core's own Arrow/NDJSON encoding.
#
# databricks-sql-connector is likewise test-only: tests/conftest.py's Thrift
# mock server (protocol="thrift") builds/parses real TBinaryProtocol wire
# bytes using this package's installed, Apache-Thrift-compiler-generated
# `databricks.sql.thrift_api.TCLIService` module (ttypes.py's real structs +
# TCLIService.py's real Processor dispatch) rather than hand-rolling a
# second Python Thrift codec to duplicate rust/arrowbricks_core/src/
# thrift.rs's own hand-rolled one -- that ttypes.py module is in fact the
# exact ground truth thrift.rs's own field IDs were read from (see its
# module doc comment), so building mock responses against it directly, byte
# for byte, is strictly more trustworthy than a second hand-written parser
# that could itself have independent bugs. Never imported by the shipped
# package -- rust/arrowbricks_core/src/thrift.rs's own hand-rolled
# TBinaryProtocol (no `thrift` crate, no databricks-sql-connector) is what
# actually ships; see that module's doc comment for why a real dependency
# was deliberately not pulled in there.
dev = [
    "arro3-core>=0.8",
    "arro3-io>=0.8",
    "databricks-sql-connector>=4.4.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "ty>=0.0.65",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Bare `pytest`/`pytest -q` (no explicit path) covers tests/ -- including
# tests/arro3_free (nested here on purpose; see its own conftest.py for why
# that doesn't pull arro3 into its collection) -- but NOT
# rust/arrowbricks_core/tests_py (the compiled extension's own PyO3-level
# tests), which needs the extension built via maturin first and is invoked
# explicitly by path where that's already true (CI's build job, or by hand).
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]
"rust/arrowbricks_core/tests_py/*" = ["S101", "S106"]
"tests/arro3_free/*" = ["S101", "S106"]
