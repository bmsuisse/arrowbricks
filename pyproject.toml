[project]
name = "arrowbricks"
version = "0.3.0"
description = "Runs SQL against a Databricks SQL warehouse via the Statement Execution API and hands you the result as Arrow -- a DB-API-ish Cursor (fetchone/fetchmany/fetchall/fetchall_arrow) or NDJSON streaming. Single Arrow engine (arro3), no DuckDB."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "arro3-core>=0.8",
    "arro3-io>=0.8",
]

[project.urls]
Repository = "https://github.com/bmsuisse/arrowbricks"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arrowbricks"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "ty>=0.0.65",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Without this, bare `pytest -q` also auto-discovers
# rust/arrowbricks_core/tests_py -- which needs the Rust extension actually
# built (maturin develop) first and will fail in the main CI job's venv,
# which never builds it. That suite is invoked explicitly by path in the
# rust-test CI job instead.
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]
"rust/arrowbricks_core/tests_py/*" = ["S101", "S106"]
