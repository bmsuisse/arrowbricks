name: Release

# Auto-release: every push to main runs the full CI suite, then publishes to
# PyPI iff pyproject.toml's version has no matching `vX.Y.Z` tag yet. So a
# release is just "bump the version (+ CHANGELOG) in a PR and merge it"; the
# tag and GitHub Release are created here after a successful publish.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report whether a release would happen without publishing/tagging anything"
        type: boolean
        default: false

# Two quick merges must not race each other into publishing the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  plan:
    name: Detect version bump
    needs: test
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          CARGO_VERSION=$(grep -m1 '^version = ' rust/arrowbricks_core/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::warning::pyproject.toml ($VERSION) and rust/arrowbricks_core/Cargo.toml ($CARGO_VERSION) versions differ -- only pyproject.toml's is published"
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            RELEASE=false
          else
            RELEASE=true
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "arrowbricks: release=$RELEASE version=$VERSION"

  # abi3-py311 means one wheel per (OS, arch) covers every Python >= 3.11 --
  # no per-Python-version build matrix needed, unlike a non-abi3 PyO3 crate.
  #
  # aarch64 builds natively on a hosted arm64 runner rather than
  # cross-compiling from x86_64 -- this crate's TLS crypto backend (`ring`,
  # previously `aws-lc-sys` -- see Cargo.toml's own comment on why) compiles
  # native C/assembly via a `cc` build-dependency, and aws-lc-sys's version
  # of that reliably failed under aarch64 cross-compile toolchains in
  # maturin-action's manylinux container. Building natively sidesteps the
  # whole cross-compilation class of issues generically, regardless of which
  # crypto backend's C code is being compiled -- not re-verified that `ring`
  # specifically still has the same cross-compile problem aws-lc-sys did,
  # since native building never needed to find out.
  linux:
    needs: plan
    if: needs.plan.outputs.release == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
    strategy:
      matrix:
        include:
          - target: x86_64
            runner: ubuntu-latest
          - target: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    needs: plan
    if: needs.plan.outputs.release == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    needs: plan
    if: needs.plan.outputs.release == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: dist

  sdist:
    needs: plan
    if: needs.plan.outputs.release == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    needs: [plan, linux, macos, windows, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write # push the vX.Y.Z tag + create the GitHub Release
      id-token: write # PyPI trusted publishing (OIDC) -- no stored API token
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # A re-run after only one artifact failed (the LICENSE-in-sdist
          # issue that broke v1.0.0's first attempt) must not fail again on
          # the wheels that already uploaded successfully -- PyPI otherwise
          # rejects a re-upload of an already-published filename outright.
          skip-existing: true
      - name: Tag release
        run: |
          git tag "v${{ needs.plan.outputs.version }}"
          git push origin "v${{ needs.plan.outputs.version }}"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.plan.outputs.version }}"
          TAG="v$VERSION"
          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -vxF "$TAG" | head -n1)
          # Prefer the hand-written CHANGELOG.md section ("## X.Y.Z ..." up to
          # the next "## "); fall back to the commit list since the last tag.
          NOTES=$(awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md)
          {
            if [ -n "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
              echo "$NOTES"
            elif [ -n "$PREV_TAG" ]; then
              echo "Changes since $PREV_TAG:"
              echo
              git log "$PREV_TAG..HEAD" --pretty=format:'- %s (%h)'
            else
              echo "Initial release."
            fi
          } > release-notes.md
          gh release create "$TAG" --title "arrowbricks v$VERSION" --notes-file release-notes.md
