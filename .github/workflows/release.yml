name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/arrowbricks_core
      - working-directory: rust/arrowbricks_core
        run: cargo fmt --check
      - working-directory: rust/arrowbricks_core
        run: cargo test --no-default-features
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
      - run: uv sync --all-extras --no-install-project
      - run: uvx maturin build --release --out dist
      - run: uv pip install dist/*.whl
      - run: uv run pytest rust/arrowbricks_core/tests_py -v
      - run: uv run ruff check .
      - run: uv run ty check src tests
      - run: uv run pytest -q

  # abi3-py311 means one wheel per (OS, arch) covers every Python >= 3.11 --
  # no per-Python-version build matrix needed, unlike a non-abi3 PyO3 crate.
  #
  # aarch64 builds natively on a hosted arm64 runner rather than
  # cross-compiling from x86_64 -- this crate's TLS crypto backend (`ring`,
  # previously `aws-lc-sys` -- see Cargo.toml's own comment on why) compiles
  # native C/assembly via a `cc` build-dependency, and aws-lc-sys's version
  # of that reliably failed under aarch64 cross-compile toolchains in
  # maturin-action's manylinux container. Building natively sidesteps the
  # whole cross-compilation class of issues generically, regardless of which
  # crypto backend's C code is being compiled -- not re-verified that `ring`
  # specifically still has the same cross-compile problem aws-lc-sys did,
  # since native building never needed to find out.
  linux:
    needs: test
    strategy:
      matrix:
        include:
          - target: x86_64
            runner: ubuntu-latest
          - target: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    needs: test
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: dist

  sdist:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    needs: [linux, macos, windows, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing (OIDC) -- no stored API token
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # A re-run after only one artifact failed (the LICENSE-in-sdist
          # issue that broke v1.0.0's first attempt) must not fail again on
          # the wheels that already uploaded successfully -- PyPI otherwise
          # rejects a re-upload of an already-published filename outright.
          skip-existing: true
