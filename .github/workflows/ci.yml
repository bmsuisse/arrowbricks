name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # One Rust build covers both the crate's own checks/tests and produces the
  # abi3 wheel every Python-version leg below installs -- avoids a redundant
  # cargo compile per matrix leg (abi3-py311 means one wheel covers every
  # supported Python already).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/arrowbricks_core
      - working-directory: rust/arrowbricks_core
        run: cargo fmt --check
      - working-directory: rust/arrowbricks_core
        # --no-default-features: skips the `extension-module` feature, which
        # disables linking against libpython -- correct for the cdylib
        # maturin ships, wrong for a plain `cargo test` binary. See
        # Cargo.toml's [features] comment.
        run: cargo test --no-default-features
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
      - run: uv sync --all-extras --no-install-project
      - run: uvx maturin build --release --out dist
      - run: uv pip install dist/*.whl
      # rust/arrowbricks_core/tests_py needs a real Python asyncio event loop
      # with real nested task contexts -- exactly what plain `cargo test`
      # can't provide, and exactly what caught the token_provider
      # event-loop-propagation bug during development.
      - run: uv run pytest rust/arrowbricks_core/tests_py -v
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras --no-install-project
      - run: uv pip install dist/*.whl
      - run: uv run ruff check .
      - run: uv run ty check src tests
      - run: uv run pytest -q
