name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ty check src tests
      - run: uv run pytest -q

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/arrowbricks_core
      - working-directory: rust/arrowbricks_core
        # --no-default-features: skips the `extension-module` feature, which
        # disables linking against libpython -- correct for the cdylib
        # maturin ships, wrong for a plain `cargo test` binary. See
        # Cargo.toml's [features] comment.
        run: cargo test --no-default-features
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
      # rust/arrowbricks_core/tests_py needs a real Python asyncio event loop
      # with real nested task contexts -- exactly what plain `cargo test`
      # can't provide, and exactly what caught the token_provider
      # event-loop-propagation bug during development. Reuses the main
      # project's deps (arro3, pytest-asyncio) rather than a separate
      # dependency set for the Rust crate's own tests.
      - run: uv sync --all-extras
      - run: uvx maturin develop --uv --release --manifest-path rust/arrowbricks_core/Cargo.toml
      - run: uv run pytest rust/arrowbricks_core/tests_py -v
